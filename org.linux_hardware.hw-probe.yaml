app-id: org.linux_hardware.hw-probe
runtime: org.kde.Platform
runtime-version: "6.7"
sdk: org.kde.Sdk
command: hw-probe
finish-args:
  - --share=network
  - --device=all
  - --filesystem=host:ro
  - --filesystem=/var/log:ro
  - --filesystem=/sys:ro
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --env=PATH=/usr/bin:/bin:/usr/sbin:/sbin:/app/bin:/app/sbin
  - --env=PERL5LIB=/app/share/perl5:/app/lib/x86_64-linux-gnu/perl-base:/app/lib/i386-linux-gnu/perl-base
  - --env=LD_LIBRARY_PATH=/app/lib/x86_64-linux-gnu/:/app/lib/i386-linux-gnu/:/app/lib64:/app/lib
  - --env=LC_ALL=C
cleanup:
  - /include
  - /man
  - /share/doc
  - /share/man
  - /share/hwinfo
  - /share/pkgconfig
  - /share/usb.ids.gz
  - /share/smartmontools
  - /share/smartd.service
  - /share/PERL5_BASE
  - /share/automake*
  - /share/info
  - /share/aclocal*
  - /share/libtool
  - /sbin/check_hd
  - /sbin/convert_hd
  - /sbin/fancontrol
  - /sbin/getsysinfo
  - /sbin/isadump
  - /sbin/isaset
  - /sbin/mk_isdnhwdb
  - /sbin/ownership
  - /sbin/pwmconfig
  - /sbin/sensors-detect
  - /sbin/setpci
  - /sbin/update-pciids
  - /sbin/update-usbids.sh
  - /sbin/vpddecode
  - /sbin/smartd
  - /sbin/update-smart-drivedb
  - /lib64/pkgconfig
  - /lib/pkgconfig
  - /lib/libltdl*
  - /bin/acpibin
  - /bin/acpiexamples
  - /bin/acpiexec
  - /bin/acpihelp
  - /bin/acpinames
  - /bin/acpisrc
  - /bin/kmod
  - /bin/lsusb.py
  - /bin/sensors-conf-convert
  - /bin/usbhid-dump
  - /bin/lex
  - /bin/automake*
  - /bin/aclocal*
  - /bin/libtool*
  - /etc/init.d
  - /etc/smartd_warning.d
  - /etc/sensors.d
  - /etc/smartd.conf
  - /etc/smartd_warning.sh
  - /var/lib
  - /lib/*.a
  - /lib/*.la
  - /usr
modules:
  - name: automake
    buildsystem: simple
    build-commands:
      - ./configure --prefix=$FLATPAK_DEST
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/automake/automake-1.15.tar.xz
        sha256: 9908c75aabd49d13661d6dcb1bc382252d22cc77bf733a2d55e87f2aa2db8636
  - name: libtool
    buildsystem: simple
    build-commands:
      - ./configure --prefix=$FLATPAK_DEST
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/libtool/libtool-2.4.6.tar.xz
        sha256: 7c87a8c2c8c0fc9cd5019e402bed4292462d00a718a7cd5f11218153bf28b26f
  - name: edid-decode
    buildsystem: simple
    build-commands:
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install DESTDIR=$FLATPAK_DEST bindir=/bin mandir=/share/man
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.4/edid-decode-20180622.tar.gz
        sha256: ab44c58a3712beca8ffa0ac937dc24d337cb0ecd18e703b4ddf3a10b0df35e1e
  - name: dmidecode
    buildsystem: simple
    build-commands:
      - sed -i -e 's/ -O2/ -s -O2/' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install prefix=/ DESTDIR=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://download-mirror.savannah.gnu.org/releases/dmidecode/dmidecode-3.6.tar.xz
        sha256: e40c65f3ec3dafe31ad8349a4ef1a97122d38f65004ed66575e1a8d575dd8bae
  - name: iproute2
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - install -D ./ip/ip $FLATPAK_DEST/sbin/ip
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/linux/utils/net/iproute2/iproute2-5.9.0.tar.xz
        sha256: a25dac94bcdcf2f73316c7f812115ea7a5710580bad892b08a83d00c6b33dacf
  - name: lm-sensors
    buildsystem: simple
    build-commands:
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install BUILD_STATIC_LIB=0 DEBUG=0 PREFIX=/ DESTDIR=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://github.com/lm-sensors/lm-sensors/archive/V3-6-0.tar.gz
        sha256: 0591f9fa0339f0d15e75326d0365871c2d4e2ed8aa1ff759b3a55d3734b7d197
  - name: libkmod
    buildsystem: simple
    build-commands:
      - ./configure --disable-debug --disable-python --disable-logging --disable-test-modules --disable-manpages --prefix=/
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install DESTDIR=$FLATPAK_DEST
      - install -D ./tools/lsmod $FLATPAK_DEST/bin/lsmod
    sources:
      - type: archive
        url: https://cdn.kernel.org/pub/linux/utils/kernel/kmod/kmod-25.tar.xz
        sha256: 7165e6496656159dcb909a91ed708a0fe273a4b128b4b1dc997ccb5189eef1cd
  - name: libusb-1
    buildsystem: simple
    build-commands:
      - NOCONFIGURE=1 sh autogen.sh
      - ./configure --disable-static --disable-udev --prefix=/
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install DESTDIR=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/archive/v1.0.27.tar.gz
        sha256: e8f18a7a36ecbb11fb820bd71540350d8f61bcd9db0d2e8c18a6fb80b214a3de
  - name: usbutils
    buildsystem: simple
    build-commands:
      - sed -i -e 's/usbhid-dump//' Makefile.*
      - ./configure --prefix=/ LIBUSB_CFLAGS='-I'$FLATPAK_DEST'/include/libusb-1.0' LIBUSB_LIBS='-L'$FLATPAK_DEST'/lib64 -L'$FLATPAK_DEST'/lib -lusb-1.0'
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install DESTDIR=$FLATPAK_DEST
      - sed -i -e 's|/share/usb.ids|/var/tmp/P_USB|' $FLATPAK_DEST/bin/lsusb
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/linux/utils/usb/usbutils/usbutils-017.tar.xz
        sha256: a6a25ffdcf9103e38d7a44732aca17073f4e602b92e4ae55625231a82702e05b
  - name: pciutils
    buildsystem: simple
    build-commands:
      - make install PREFIX=/ DESTDIR=$FLATPAK_DEST SHARED=no LIBKMOD=no HWDB=no ZLIB=no DNS=no
      - sed -i -e 's|/share/pci.ids|/var/tmp/P_PCI|' $FLATPAK_DEST/sbin/lspci
    sources:
      - type: archive
        url: https://github.com/pciutils/pciutils/archive/v3.6.2.tar.gz
        sha256: d84d7096a71890f0ddddc50e88ac5a3bc7412bf48d8100fc15857a411564687d
  - name: acpica-unix
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install DESTDIR=$FLATPAK_DEST PREFIX=/
    sources:
      - type: archive
        url: https://github.com/acpica/acpica/files/14718333/acpica-unix-20240321.tar.gz
        sha256: 54a299487925fd3e0551c95f9d5cee4f4984930273983eff67aa5cd46f8f338b
  - name: hdparm
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install DESTDIR=`pwd`/INST
      - install -D INST/sbin/hdparm $FLATPAK_DEST/sbin/hdparm
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.6/hdparm-9.65.tar.gz
        sha256: d14929f910d060932e717e9382425d47c2e7144235a53713d55a94f7de535a4b
  - name: smartmontools
    buildsystem: simple
    build-commands:
      - NOCONFIGURE=1 sh autogen.sh
      - ./configure --with-nvme-devicescan --prefix=/ --with-systemdsystemunitdir=/share
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install DESTDIR=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.6/smartmontools-7.4.tar.gz
        sha256: e9a61f641ff96ca95319edfb17948cd297d0cd3342736b2c49c99d4716fb993d
  - name: util-linux
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS dmesg
      - make -j $FLATPAK_BUILDER_N_JOBS lscpu
      - make -j $FLATPAK_BUILDER_N_JOBS lsblk
      - find . -type f | grep -v img.xz | perl -lne 'print if -B and -x' | xargs strip
      - install -D ./dmesg $FLATPAK_DEST/bin/dmesg
      - install -D ./lscpu $FLATPAK_DEST/bin/lscpu
      - install -D ./lsblk $FLATPAK_DEST/bin/lsblk
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.40/util-linux-2.40.2.tar.xz
        sha256: d78b37a66f5922d70edf3bdfb01a6b33d34ed3c3cafd6628203b2a2b67c8e8b3
  - name: libx86emu
    buildsystem: simple
    build-commands:
      - echo '3.5' > VERSION
      - rm -f git2log
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install DESTDIR=`pwd`/INST
      - cp -fr INST/usr/* $FLATPAK_DEST/
    sources:
      - type: archive
        url: https://github.com/wfeldt/libx86emu/archive/3.5.tar.gz
        sha256: 91da55f5da55017d5a80e2364de30f9520aa8df2744ff587a09ba58d6e3536c8
  - name: lex
    buildsystem: simple
    build-commands:
      - NOCONFIGURE=1 sh autogen.sh
      - ./configure
      - make -j $FLATPAK_BUILDER_N_JOBS
      - install -D src/flex $FLATPAK_DEST/bin/lex
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.4/flex-20181004.tar.gz
        sha256: bd7d248de7792dd2de2089a16b7ea60f94b2056e721e1f0f1b28083f4792e902
  - name: perl-uri
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/URI-5.08.tar.gz
        sha256: 7e2c6fe3b1d5947da334fa558a96e748aaa619213b85bcdce5b5347d4d26c46e
  - name: perl-http-message
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/HTTP-Message-6.37.tar.gz
        sha256: 0e59da0a85e248831327ebfba66796314cb69f1bfeeff7a9da44ad766d07d802
  - name: perl-net-http
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/Net-HTTP-6.22.tar.gz
        sha256: 62faf9a5b84235443fe18f780e69cecf057dea3de271d7d8a0ba72724458a1a2
  - name: perl-try-tiny
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/Try-Tiny-0.31.tar.gz
        sha256: 3300d31d8a4075b26d8f46ce864a1d913e0e8467ceeba6655d5d2b2e206c11be
  - name: perl-lwp-mediatypes
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/G/GA/GAAS/LWP-MediaTypes-6.02.tar.gz
        sha256: 18790b0cc5f0a51468495c3847b16738f785a2d460403595001e0b932e5db676
  - name: perl-http-date
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/G/GA/GAAS/HTTP-Date-6.02.tar.gz
        sha256: e8b9941da0f9f0c9c01068401a5e81341f0e3707d1c754f8e11f42a7e629e333
  - name: perl-timedate
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/G/GB/GBARR/TimeDate-2.30.tar.gz
        sha256: 75bd254871cb5853a6aa0403ac0be270cdd75c9d1b6639f18ecba63c15298e86
  - name: libwww-perl
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/libwww-perl-6.36.tar.gz
        sha256: 75c034ab4b37f4b9506dc644300697505582cf9545bcf2e2079e7263f675290a
  - name: perl-parent
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/C/CO/CORION/parent-0.238.tar.gz
        sha256: 38f58fdef3e28a194c9c8d0dc5d02672faf93c069f40c5bcb1fabeadbbc4d2d1
  - name: perl-time-local
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/Time-Local-1.30.tar.gz
        sha256: c7744f6b2986b946d3e2cf034df371bee16cdbafe53e945abb1a542c4f8920cb
  - name: perl-data-dumper
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - chmod 777 -R ./INST
      - find ./INST -type f | perl -lne 'print if -B and -x' | xargs strip
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/usr/lib/perl5/*/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/S/SM/SMUELLER/Data-Dumper-2.161.tar.gz
        sha256: 3aa4ac1b042b3880438165fb2b2139d377564a8e9928ffe689ede5304ee90558
  - name: PyQt6
    buildsystem: simple
    build-commands:
      - sip-install
        --confirm-license
        --no-designer-plugin
        --no-qml-plugin
        --no-tools
        --concatenate=1
        --no-docstrings
        --verbose
        --qt-shared
        --target-dir=/app/lib/python3.9/site-packages/
        --enable=QtCore
        --enable=QtGui
        --enable=QtWidgets
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/ce/c6/99127e39e62f0c887a39d9644012867874a68983bd0fe641f00aa796de88/PyQt6-6.7.0.tar.gz
        sha256: 3d31b2c59dc378ee26e16586d9469842483588142fc377280aad22aaf2fa6235
    modules:
      - name: python3-sip
        buildsystem: simple
        build-commands:
          - pip3 install --no-deps --no-use-pep517 --prefix=$FLATPAK_DEST .
        sources:
          - type: archive
            url: https://files.pythonhosted.org/packages/3e/f5/85bfb3c716b8eda9e2b0c0c5f36acb701746045c828a4497a44e581db3a6/sip-6.8.5.tar.gz
            sha256: 5dddd5966e9875d89ecde9d3e6ac63225f9972e4d25c09e20fa22f1819409c70
        modules:
          - name: python-toml
            buildsystem: simple
            build-commands:
                - pip3 install --no-deps --no-use-pep517 --prefix=$FLATPAK_DEST .
            sources:
                - type: archive
                  url: https://files.pythonhosted.org/packages/source/t/toml/toml-0.10.2.tar.gz
                  sha256: b3bda1d108d5dd99f4a20d24d9c348e91c4db7ab1b749200bded2f839ccbe68f
          - name: python-packaging
            buildsystem: simple
            build-commands:
                - pip3 install --no-deps --no-use-pep517 --prefix=$FLATPAK_DEST .
            sources:
                - type: archive
                  url: https://files.pythonhosted.org/packages/source/p/packaging/packaging-24.1.tar.gz
                  sha256: 026ed72c8ed3fcce5bf8950572258698927fd1dbda10a5e981cdf0ac37f4f002
            cleanup:
                - "*"
      - name: PyQt6_sip
        buildsystem: simple
        build-commands:
          - pip3 install --no-deps --no-use-pep517 --prefix=$FLATPAK_DEST .
        sources:
          - type: archive
            url: https://files.pythonhosted.org/packages/98/23/e54e02a44afc357ccab1b88575b90729664164358ceffde43e4f2e549daa/PyQt6_sip-13.6.0.tar.gz
            sha256: 2486e1588071943d4f6657ba09096dc9fffd2322ad2c30041e78ea3f037b5778
      - name: python-pyparsing
        buildsystem: simple
        build-commands:
          - pip3 install --no-deps --no-use-pep517 --prefix=$FLATPAK_DEST .
        sources:
          - type: archive
            url: https://files.pythonhosted.org/packages/source/p/pyparsing/pyparsing-3.1.2.tar.gz
            sha256: a1bac0ce561155ecc3ed78ca94d3c9378656ad4c94c1270de543f621420f94ad
        cleanup:
          - "*"
      - name: PyQt-builder
        buildsystem: simple
        build-commands:
          - pip3 install --no-deps --no-use-pep517 --prefix=$FLATPAK_DEST .
        sources:
          - type: archive
            url: https://files.pythonhosted.org/packages/f0/73/9e2755469405520b38162a4f594db1e0a28e2d29ab367acba1cd3c0783b5/pyqt_builder-1.16.3.tar.gz
            sha256: 3ce5c03dc3fc856b782da3f53b4f3f3b6556aad7bd8416d7bbfc274d03bcf032
        cleanup:
        - "*"
  - name: hwinfo
    skip-arches:
      - aarch64
      - arm
    buildsystem: simple
    build-commands:
      - echo '22.1' > VERSION
      - rm -f git2log
      - sed -i -e 's/ -g / -s /' Makefile.common
      - CFLAGS='-I'$FLATPAK_DEST'/include' LDFLAGS='-L'$FLATPAK_DEST'/lib64 -L'$FLATPAK_DEST'/lib -lx86emu' LD_LIBRARY_PATH=$FLATPAK_DEST'/lib64:'$FLATPAK_DEST'/lib' make
      - make install DESTDIR=`pwd`/INST
      - cp -fr INST/usr/* $FLATPAK_DEST/
